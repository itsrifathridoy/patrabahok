{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — patrabahok</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/alpine.min.js" defer></script>
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="brand">patrabahok</div>
      <a href="/" class="{{if eq .Active "overview"}}active{{end}}"><span class="icon">◧</span>Overview</a>
      <a href="/domains" class="{{if eq .Active "domains"}}active{{end}}"><span class="icon">◎</span>Domains</a>
      <a href="/mailboxes" class="{{if eq .Active "mailboxes"}}active{{end}}"><span class="icon">✉</span>Mailboxes</a>
      <a href="/aliases" class="{{if eq .Active "aliases"}}active{{end}}"><span class="icon">↪</span>Aliases</a>
      <a href="/dkim" class="{{if eq .Active "dkim"}}active{{end}}"><span class="icon">⚿</span>DNS analysis</a>
      <a href="/queue" class="{{if eq .Active "queue"}}active{{end}}"><span class="icon">▤</span>Mail queue</a>
      <a href="/diagnostics" class="{{if eq .Active "diagnostics"}}active{{end}}"><span class="icon">♥</span>Diagnostics</a>
      <a href="/tokens" class="{{if eq .Active "tokens"}}active{{end}}"><span class="icon">⚷</span>API tokens</a>
      <a href="/admins" class="{{if eq .Active "admins"}}active{{end}}"><span class="icon">◈</span>Admins</a>
      <div class="spacer"></div>
      <a href="/settings" class="{{if eq .Active "settings"}}active{{end}}"><span class="icon">⚙</span>Settings</a>
      <form method="post" action="/logout"><button type="submit" class="btn" style="width:100%;margin-top:4px;">Log out</button></form>
    </nav>
    <main class="main">
      {{template "content" .}}
    </main>
  </div>
</body>
</html>
{{end}}
