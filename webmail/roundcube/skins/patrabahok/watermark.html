<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
<style type="text/css">
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  display: flex; align-items: center; justify-content: center;
  background: #fff;
}
.mark {
  width: 132px; height: 132px; border-radius: 36px;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 30% 30%, rgba(37, 99, 235, .14), transparent 60%),
    radial-gradient(circle at 75% 70%, rgba(23, 165, 88, .16), transparent 60%),
    #f6f8fb;
}
.mark img { width: 64px; height: 64px; opacity: .55; filter: grayscale(.2); }
html.dark-mode body { background: #0f1d36; }
html.dark-mode .mark { background:
    radial-gradient(circle at 30% 30%, rgba(96, 165, 250, .16), transparent 60%),
    radial-gradient(circle at 75% 70%, rgba(52, 211, 153, .14), transparent 60%),
    #0b1426; }
</style>
<script>
  try {
    if (document.cookie.indexOf('colorMode=dark') > -1
      || (document.cookie.indexOf('colorMode=light') === -1 && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) {
      document.documentElement.className += ' dark-mode';
    }
  } catch (e) { }
</script>
</head>
<body><div class="mark"><img src="images/logo.svg" alt=""></div></body>
</html>
